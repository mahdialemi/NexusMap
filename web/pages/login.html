<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NexusMap</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/app.css">
    <meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align:center;margin-bottom:12px;">
                <svg width="48" height="48" viewBox="0 0 32 32"><use href="#icon-logo"/></svg>
            </div>
            <h2 style="text-align:center;margin-bottom:20px;">NexusMap</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" class="form-control" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <div id="login-error" style="color: #ef4444; margin-bottom: 10px; display: none;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/login.js"></script>

    <div class="footer">
        NexusMap v0.9.0 &middot; Made with <span style="font-weight:600;color:var(--accent);">vibe coding</span> by <a href="https://github.com/mahdialemi" target="_blank" rel="noopener noreferrer" class="footer-link">Mahdi Alemi</a>
    </div>
</body>
</html>
