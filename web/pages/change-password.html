<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="change_password.title">Change Password - NexusMap</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/change-password.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="cp-logo">
                <svg width="48" height="48" viewBox="0 0 32 32"><use href="#icon-logo"/></svg>
            </div>
            <h2 data-i18n="change_password.title">Change Password</h2>
            <p class="cp-subtitle" data-i18n="change_password.subtitle">You must change your password before continuing.</p>
            <form id="change-form">
                <div class="form-group">
                    <label data-i18n="change_password.current">Current Password</label>
                    <input type="password" id="old-password" class="form-control" required autocomplete="current-password" placeholder="Current Password" data-i18n-placeholder="change_password.current">
                </div>
                <div class="form-group">
                    <label data-i18n="change_password.new">New Password</label>
                    <input type="password" id="new-password" class="form-control" required autocomplete="new-password" placeholder="New Password" data-i18n-placeholder="change_password.new">
                    <div class="pw-strength"><div class="pw-strength-fill" id="pw-strength-fill"></div></div>
                </div>
                <div class="cp-reqs">
                    <div class="pw-req" id="req-length" data-i18n="change_password.req_length">At least 12 characters</div>
                    <div class="pw-req" id="req-upper" data-i18n="change_password.req_upper">Uppercase letter</div>
                    <div class="pw-req" id="req-lower" data-i18n="change_password.req_lower">Lowercase letter</div>
                    <div class="pw-req" id="req-digit" data-i18n="change_password.req_digit">Digit</div>
                    <div class="pw-req" id="req-special" data-i18n="change_password.req_special">Special character</div>
                </div>
                <div class="form-group">
                    <label data-i18n="change_password.confirm">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" required autocomplete="new-password" placeholder="Confirm New Password" data-i18n-placeholder="change_password.confirm">
                </div>
                <div id="error-msg" class="cp-error"></div>
                <button type="submit" class="btn btn-primary btn-cp" data-i18n="change_password.submit">Change Password</button>
            </form>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/change-password.js"></script>

    <div class="footer">
        <span data-i18n="app.name">NexusMap</span> <span class="app-version" data-i18n="app.version">v0.9.4</span> &middot; <span data-i18n="footer.made_with">Made with</span> <span class="footer-accent" data-i18n="footer.vibe">vibe coding</span> <span data-i18n="footer.by">by</span> <a href="https://github.com/mahdialemi" target="_blank" rel="noopener noreferrer" class="footer-link">Mahdi Alemi</a>
    </div>
</body>
</html>
