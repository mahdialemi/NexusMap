<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - NexusMap</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .pw-req { font-size:0.82rem; color:var(--text-muted); margin:4px 0; padding-left:20px; position:relative; }
        .pw-req::before { content:'✗'; position:absolute; left:0; color:var(--red); font-weight:700; }
        .pw-req.met::before { content:'✓'; color:var(--green); }
        .pw-req.met { color:var(--text); }
        .pw-strength { height:4px; border-radius:2px; margin-top:6px; background:var(--bg-input); overflow:hidden; }
        .pw-strength-fill { height:100%; width:0; border-radius:2px; transition:width 0.2s, background 0.2s; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>Change Password</h2>
            <p style="color:var(--text-muted);margin-bottom:20px;text-align:center;">You must change your password before continuing.</p>
            <form id="change-form">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="old-password" class="form-control" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" class="form-control" required autocomplete="new-password">
                    <div class="pw-strength"><div class="pw-strength-fill" id="pw-strength-fill"></div></div>
                </div>
                <div style="margin:-8px 0 12px 0;">
                    <div class="pw-req" id="req-length">At least 8 characters</div>
                    <div class="pw-req" id="req-upper">Uppercase letter</div>
                    <div class="pw-req" id="req-lower">Lowercase letter</div>
                    <div class="pw-req" id="req-digit">Digit</div>
                    <div class="pw-req" id="req-special">Special character</div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" required autocomplete="new-password">
                </div>
                <div id="error-msg" style="color:var(--red);margin-bottom:8px;display:none;font-size:0.85rem;"></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Change Password</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        initCSRF();

        (async function() {
            try {
                var u = await me();
                if (!u) { window.location.href = '/login'; return; }
                if (!u.must_change_password) { window.location.href = '/'; return; }
            } catch(e) { window.location.href = '/login'; }
        })();

        function checkStrength(pw) {
            var length = pw.length >= 8;
            var upper = /[A-Z]/.test(pw);
            var lower = /[a-z]/.test(pw);
            var digit = /\d/.test(pw);
            var special = /[^A-Za-z0-9]/.test(pw);

            document.getElementById('req-length').className = 'pw-req' + (length ? ' met' : '');
            document.getElementById('req-upper').className = 'pw-req' + (upper ? ' met' : '');
            document.getElementById('req-lower').className = 'pw-req' + (lower ? ' met' : '');
            document.getElementById('req-digit').className = 'pw-req' + (digit ? ' met' : '');
            document.getElementById('req-special').className = 'pw-req' + (special ? ' met' : '');

            var met = [length, upper, lower, digit, special].filter(Boolean).length;
            var pct = (met / 5) * 100;
            var fill = document.getElementById('pw-strength-fill');
            fill.style.width = pct + '%';
            if (pct <= 40) fill.style.background = 'var(--red)';
            else if (pct <= 60) fill.style.background = 'var(--orange)';
            else if (pct <= 80) fill.style.background = 'var(--yellow)';
            else fill.style.background = 'var(--green)';
        }

        document.getElementById('new-password').addEventListener('input', function() {
            checkStrength(this.value);
        });

        document.getElementById('change-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            var oldPass = document.getElementById('old-password').value;
            var newPass = document.getElementById('new-password').value;
            var confirm = document.getElementById('confirm-password').value;
            var errorEl = document.getElementById('error-msg');
            errorEl.style.display = 'none';

            if (newPass !== confirm) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            var length = newPass.length >= 8;
            var upper = /[A-Z]/.test(newPass);
            var lower = /[a-z]/.test(newPass);
            var digit = /\d/.test(newPass);
            var special = /[^A-Za-z0-9]/.test(newPass);
            if (!length || !upper || !lower || !digit || !special) {
                errorEl.textContent = 'Password must meet all complexity requirements';
                errorEl.style.display = 'block';
                return;
            }

            try {
                await changePassword(oldPass, newPass);
                window.location.href = '/';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });
    </script>

    <div class="footer">
        NexusMap v1.0 &middot; Made with <span style="font-weight:600;color:var(--accent);">vibe coding</span> by <a href="https://github.com/mahdialemi" target="_blank" rel="noopener noreferrer" class="footer-link">Mahdi Alemi</a>
    </div>
</body>
</html>
