<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - NexusMap</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/change-password.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="cp-logo">
                <svg width="48" height="48" viewBox="0 0 32 32"><use href="#icon-logo"/></svg>
            </div>
            <h2>Change Password</h2>
            <p class="cp-subtitle">You must change your password before continuing.</p>
            <form id="change-form">
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="old-password" class="form-control" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" class="form-control" required autocomplete="new-password">
                    <div class="pw-strength"><div class="pw-strength-fill" id="pw-strength-fill"></div></div>
                </div>
                <div class="cp-reqs">
                    <div class="pw-req" id="req-length">At least 12 characters</div>
                    <div class="pw-req" id="req-upper">Uppercase letter</div>
                    <div class="pw-req" id="req-lower">Lowercase letter</div>
                    <div class="pw-req" id="req-digit">Digit</div>
                    <div class="pw-req" id="req-special">Special character</div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" required autocomplete="new-password">
                </div>
                <div id="error-msg" class="cp-error"></div>
                <button type="submit" class="btn btn-primary btn-cp">Change Password</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/change-password.js"></script>

    <div class="footer">
        NexusMap v0.9.2 &middot; Made with <span class="footer-accent">vibe coding</span> by <a href="https://github.com/mahdialemi" target="_blank" rel="noopener noreferrer" class="footer-link">Mahdi Alemi</a>
    </div>
</body>
</html>
