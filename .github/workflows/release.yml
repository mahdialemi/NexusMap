name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            out: nexusmap-linux
          - os: windows
            arch: amd64
            out: nexusmap-windows.exe
          - os: darwin
            arch: amd64
            out: nexusmap-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: |
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o "${{ matrix.out }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true

      - name: Rename for release
        run: |
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          mv nexusmap-linux     "nexusmap-${VER}-linux-amd64"
          mv nexusmap-windows.exe "nexusmap-${VER}-windows-amd64.exe"
          mv nexusmap-darwin    "nexusmap-${VER}-darwin-amd64"

      - uses: softprops/action-gh-release@v2
        with:
          files: nexusmap-*
          generate_release_notes: true
