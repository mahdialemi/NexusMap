name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: windows
            arch: amd64
            ext: .exe
          - os: darwin
            arch: amd64
            ext: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o nexusmap-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - uses: actions/upload-artifact@v4
        with:
          name: nexusmap-${{ matrix.os }}-${{ matrix.arch }}
          path: nexusmap-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nexusmap-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: nexusmap-*
          generate_release_notes: true
